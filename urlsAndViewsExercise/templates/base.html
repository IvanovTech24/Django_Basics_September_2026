{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Travel Blog{% endblock %}</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --brand-primary: #6366f1;   /* indigo */
            --brand-secondary: #ec4899; /* pink */
            --brand-accent: #14b8a6;    /* teal */
        }

        body {
            background: linear-gradient(135deg, #f8fafc 0%, #eef2ff 100%);
            min-height: 100vh;
            font-family: 'Poppins', 'Segoe UI', Tahoma, sans-serif;
            color: #1e293b;
        }

        /* ===== Navbar ===== */
        .navbar {
            background: linear-gradient(90deg, #4f46e5 0%, #7c3aed 50%, #ec4899 100%) !important;
            box-shadow: 0 4px 20px rgba(79, 70, 229, 0.25);
        }
        .navbar-brand {
            font-weight: 700;
            letter-spacing: 0.5px;
            font-size: 1.4rem;
        }
        .navbar .nav-link {
            font-weight: 500;
            transition: all 0.2s ease;
            border-radius: 8px;
            padding: 0.5rem 1rem !important;
            margin: 0 0.15rem;
        }
        .navbar .nav-link:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: translateY(-1px);
        }
        .navbar .nav-link.active {
            background: rgba(255, 255, 255, 0.22);
            font-weight: 600;
        }

        /* ===== Cards ===== */
        .card {
            border: none;
            border-radius: 16px;
            transition: all 0.25s ease;
            overflow: hidden;
        }
        .card:hover {
            transform: translateY(-6px);
            box-shadow: 0 20px 40px rgba(99, 102, 241, 0.18) !important;
        }

        /* Цветна лента отгоре на всяка карта */
        .card-gradient-top {
            height: 5px;
            background: linear-gradient(90deg, var(--brand-primary), var(--brand-secondary), var(--brand-accent));
        }

        /* Различни цветове за всяка карта в list.html */
        .destination-card:nth-child(3n+1) .card-gradient-top {
            background: linear-gradient(90deg, #6366f1, #8b5cf6);
        }
        .destination-card:nth-child(3n+2) .card-gradient-top {
            background: linear-gradient(90deg, #ec4899, #f43f5e);
        }
        .destination-card:nth-child(3n+3) .card-gradient-top {
            background: linear-gradient(90deg, #14b8a6, #06b6d4);
        }

        /* ===== Typography ===== */
        .page-title {
            font-weight: 700;
            background: linear-gradient(90deg, #4f46e5, #ec4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* ===== Buttons ===== */
        .btn-primary {
            background: linear-gradient(90deg, #6366f1, #8b5cf6);
            border: none;
            border-radius: 10px;
            font-weight: 500;
            transition: all 0.2s ease;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(99, 102, 241, 0.4);
        }
        .btn-outline-primary {
            border-radius: 10px;
            border-color: #6366f1;
            color: #6366f1;
            font-weight: 500;
        }
        .btn-outline-primary:hover {
            background: linear-gradient(90deg, #6366f1, #8b5cf6);
            border-color: transparent;
        }

        /* ===== Badges ===== */
        .badge-gradient {
            background: linear-gradient(90deg, #6366f1, #ec4899);
            color: white;
            font-weight: 500;
            padding: 0.5em 1em;
            border-radius: 20px;
        }

        /* ===== Icons in titles ===== */
        .title-icon {
            background: linear-gradient(135deg, #6366f1, #ec4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* ===== Footer ===== */
        footer {
            color: #64748b;
            border-top: 1px solid #e2e8f0;
            margin-top: 3rem;
        }
        footer a {
            color: #6366f1;
            font-weight: 500;
            text-decoration: none;
        }
        footer a:hover {
            text-decoration: underline;
            color: #ec4899;
        }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>

    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg navbar-dark shadow-sm">
        <div class="container">
            <a class="navbar-brand" href="{% url 'destinations:list' %}">
                <i class="bi bi-globe-americas"></i> TravelBlog
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="mainNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link {% if request.resolver_match.url_name == 'list' %}active{% endif %}"
                           href="{% url 'destinations:list' %}">
                            <i class="bi bi-geo-alt"></i> Destinations
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.resolver_match.url_name == 'dashboard' %}active{% endif %}"
                           href="{% url 'destinations:dashboard' %}">
                            <i class="bi bi-speedometer2"></i> Dashboard
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- MAIN CONTENT -->
    <main class="container py-5">
        {% block content %}{% endblock %}
    </main>

    <!-- FOOTER -->
    <footer class="text-center py-4">
        <p class="mb-0">
            © {% now "Y" %} TravelBlog · Built with
            <a href="{% url 'destinations:redirect' %}">SoftUni</a>
        </p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
