{% extends 'base.html' %}

{% block title %}Reviews{% endblock %}

{% block content %}
<h1 class="page-title mb-4">
    <i class="bi bi-star-fill title-icon"></i> Reviews
</h1>

<div class="row g-4">
    {% for review in reviews %}
        <div class="col-md-6">
            <div class="card shadow-sm h-100">
                <div class="card-gradient-top" style="background: linear-gradient(90deg, #f59e0b, #ec4899);"></div>
                <div class="card-body">
                    <div class="d-flex justify-content-between align-items-start mb-2">
                        <h5 class="card-title mb-0 fw-bold">{{ review.name }}</h5>
                        <span class="badge" style="background: linear-gradient(90deg, #f59e0b, #eab308); color: white; padding: 0.5em 0.9em; border-radius: 20px;">
                            <i class="bi bi-star-fill"></i> {{ review.rating }}
                        </span>
                    </div>
                    <p class="card-text text-secondary mb-0">{{ review.body }}</p>
                </div>
            </div>
        </div>
    {% empty %}
        <div class="col-12">
            <div class="text-center py-5">
                <i class="bi bi-star display-1 title-icon"></i>
                <h3 class="mt-3 fw-bold">No reviews yet</h3>
                <p class="text-muted">Check back later!</p>
            </div>
        </div>
    {% endfor %}
</div>
{% endblock %}
